apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-argocd
  labels:
    app.kubernetes.io/name: hello-argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-argocd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-argocd
    spec:
      containers:
        - name: hello-argocd
          image: ghcr.io/replace-me/hello-argocd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
